name: ElsewhereMobile
options:
  bundleIdPrefix: $(APP_BUNDLE_ID)
  developmentLanguage: en
  knownRegions: [en, zh-Hans]
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic

targetTemplates:
  MobileApp:
    type: application
    platform: iOS
    sources: [App, Domain, Engine, Services, DesignSystem, Features, Intents, Resources]
    dependencies:
      - framework: build/ElsewhereCore.xcframework
        embed: false
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    info:
      path: build/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: Elsewhere
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: 通过本地网络连接你已配对的设备，以设置或清除模拟位置。
        UIBackgroundModes: [fetch]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: 设备配对记录
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.elsewhere.mobile.mobiledevicepairing
              - com.apple.property-list
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.elsewhere.mobile.mobiledevicepairing
            UTTypeDescription: 设备配对记录
            UTTypeConformsTo: [com.apple.property-list]
            UTTypeTagSpecification:
              public.filename-extension: [mobiledevicepairing]

targets:
  ElsewhereMobile:
    templates: [MobileApp]
    dependencies:
      - target: ElsewhereWidgets
        embed: true
      - target: ElsewhereTunnel
        embed: true
      - target: ElsewherePairingImport
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: App/ElsewhereMobile.entitlements
    info:
      properties:
        BGTaskSchedulerPermittedIdentifiers: [$(APP_BUNDLE_ID).exit-refresh]
        ElsewhereTunnelBundleID: $(APP_BUNDLE_ID).tunnel
        ElsewhereSnapshotAppGroup: $(SNAPSHOT_APP_GROUP)
        ElsewhereImportAppGroup: $(IMPORT_APP_GROUP)

  ElsewhereMobileFree:
    templates: [MobileApp]
    settings:
      base:
        PRODUCT_MODULE_NAME: ElsewhereMobile
        PRODUCT_BUNDLE_IDENTIFIER: $(FREE_APP_BUNDLE_ID)
    info:
      properties:
        BGTaskSchedulerPermittedIdentifiers: [$(FREE_APP_BUNDLE_ID).exit-refresh]
        ElsewhereTunnelBundleID: ""
        ElsewhereSnapshotAppGroup: ""
        ElsewhereImportAppGroup: ""

  ElsewhereWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - path: Domain/AppIdentifiers.swift
      - path: Intents/ElsewhereIntents.swift
      - path: Domain/Coordinate.swift
      - path: Domain/Place.swift
      - path: Domain/DeviceModels.swift
      - path: Domain/ExitProxy.swift
      - path: Services/AppStateStore.swift
      - path: Resources/Localizable.xcstrings
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
      CODE_SIGN_ENTITLEMENTS: Widgets/ElsewhereWidgets.entitlements
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ELSEWHERE_WIDGET_EXTENSION"
    info:
      path: build/ElsewhereWidgets-Info.plist
      properties:
        ElsewhereImportAppGroup: ""
        ElsewhereTunnelBundleID: ""
        ElsewhereSnapshotAppGroup: $(SNAPSHOT_APP_GROUP)
        CFBundleDisplayName: Elsewhere 定位
        CFBundleShortVersionString: "1.0.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ElsewhereTunnel:
    type: app-extension
    platform: iOS
    sources:
      - TunnelExtension
      - path: Services/LoopbackPacket.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tunnel
      CODE_SIGN_ENTITLEMENTS: TunnelExtension/ElsewhereTunnel.entitlements
    info:
      path: build/ElsewhereTunnel-Info.plist
      properties:
        CFBundleDisplayName: Elsewhere 通道
        CFBundleShortVersionString: "1.0.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider

  ElsewherePairingImport:
    type: app-extension
    platform: iOS
    sources:
      - PairingImportExtension
      - path: Domain/AppIdentifiers.swift
      - path: Services/PairingInbox.swift
      - path: Resources/Localizable.xcstrings
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).pairingimport
      CODE_SIGN_ENTITLEMENTS: PairingImportExtension/ElsewherePairingImport.entitlements
    info:
      path: build/ElsewherePairingImport-Info.plist
      properties:
        ElsewhereImportAppGroup: $(IMPORT_APP_GROUP)
        CFBundleDisplayName: 导入 Elsewhere 配对记录
        CFBundleShortVersionString: "1.0.0"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 1

  ElsewhereMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ElsewhereMobile
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

  ElsewhereMobileFreeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ElsewhereMobileFree
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: $(FREE_APP_BUNDLE_ID).tests

schemes:
  ElsewhereMobile:
    build:
      targets:
        ElsewhereMobile: all
    test:
      targets: [ElsewhereMobileTests]
  ElsewhereMobileFree:
    build:
      targets:
        ElsewhereMobileFree: all
    test:
      targets: [ElsewhereMobileFreeTests]
