[package]
name = "elsewhere-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { version = "=0.1.68", default-features = false, features = [
    "ring", "tcp", "core_device", "core_device_proxy", "rsd", "xpc",
    "tunnel_tcp_stack", "mobile_image_mounter", "tss",
] }
plist = "1.10"
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1.54", features = ["rt", "sync", "time", "fs", "net"] }

[profile.release]
lto = true
codegen-units = 1
